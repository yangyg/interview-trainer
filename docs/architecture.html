<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面试刷题工作台 · 整体架构与数据流向</title>
<style>
  :root{
    --bg:#08090b;
    --panel:#0e1013;
    --panel-2:#14171c;
    --line:rgba(255,255,255,.075);
    --line-2:rgba(255,255,255,.16);
    --fg:#eef1f6;
    --fg-2:#98a1b0;
    --fg-3:#646d7c;
    --amber:#e8a33d;
    --cyan:#33c2d6;
    --violet:#9b8cff;
    --blue:#5b9dff;
    --emerald:#34d399;
    --orange:#ff8f5e;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .app{height:100%;display:flex;flex-direction:column}

  /* ---------- 顶栏 ---------- */
  .top{
    display:flex;align-items:flex-end;gap:24px;
    padding:18px 26px 12px;flex:0 0 auto;
  }
  .kicker{
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;
    color:rgba(51,194,214,.75);text-transform:uppercase;margin-bottom:7px;
  }
  .top h1{font-size:20px;font-weight:600;letter-spacing:.01em;line-height:1.25}
  .top .sub{margin-top:6px;font-size:12px;color:var(--fg-3)}
  .top .sub b{color:var(--fg-2);font-weight:500}
  .tools{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:4px}
  .tbtn{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--fg-2);font-size:12px;font-family:inherit;
    padding:6px 10px;border-radius:8px;cursor:pointer;transition:.16s;
    display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .tbtn:hover{background:var(--panel-2);border-color:var(--line-2);color:var(--fg)}
  .zoombox{
    display:flex;align-items:center;gap:2px;border:1px solid var(--line);
    background:var(--panel);border-radius:8px;padding:2px;
  }
  .zoombox button{
    appearance:none;border:0;background:transparent;color:var(--fg-2);
    width:26px;height:24px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;
  }
  .zoombox button:hover{background:var(--panel-2);color:var(--fg)}
  #zoomVal{
    font-family:var(--mono);font-size:11px;color:var(--fg-3);
    min-width:42px;text-align:center;
  }

  /* ---------- 场景 chips ---------- */
  .chips{
    display:flex;gap:8px;padding:0 26px 14px;flex:0 0 auto;
    overflow-x:auto;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--fg-2);font-family:inherit;font-size:12px;
    padding:7px 12px 7px 11px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.16s;
  }
  .chip .cdot{
    width:6px;height:6px;border-radius:50%;background:var(--fg-3);
    transition:.16s;flex:0 0 auto;
  }
  .chip:hover{background:var(--panel-2);border-color:var(--line-2);color:var(--fg)}
  .chip.on{
    background:rgba(51,194,214,.1);border-color:rgba(51,194,214,.45);color:#bfeef7;
  }
  .chip.on .cdot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .chip em{
    font-style:normal;font-family:var(--mono);font-size:10px;
    color:var(--fg-3);padding-left:2px;
  }

  /* ---------- 画布 ---------- */
  .viewport{
    position:relative;flex:1 1 auto;margin:0 26px;border:1px solid var(--line);
    border-radius:16px;overflow:hidden;
    background:
      radial-gradient(1200px 620px at 18% -10%,rgba(51,194,214,.045),transparent 60%),
      radial-gradient(900px 520px at 88% 110%,rgba(155,140,255,.05),transparent 60%),
      #0a0b0e;
    cursor:grab;
  }
  .viewport.dragging{cursor:grabbing}
  .stage{position:absolute;left:0;top:0;width:1600px;height:920px;transform-origin:0 0;
    animation:stageIn .45s cubic-bezier(.32,.72,0,1) both}
  @keyframes stageIn{from{opacity:.55}to{opacity:1}}
  #wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  #nodes{position:absolute;left:0;top:0;width:1600px;height:920px}

  /* 分层带 */
  .band{
    position:absolute;border-radius:16px;
    border:1px solid rgba(255,255,255,.05);
    background:rgba(255,255,255,.014);
  }
  .band-label{
    position:absolute;top:11px;left:16px;font-size:11px;
    letter-spacing:.04em;color:var(--fg-3);
    display:flex;align-items:center;gap:7px;
  }
  .band-label i{
    width:5px;height:5px;border-radius:50%;background:var(--tone);
    display:inline-block;opacity:.85;
  }
  .band-label b{font-weight:500;color:rgba(255,255,255,.42)}
  .band-note{
    position:absolute;top:12px;right:16px;left:auto;bottom:auto;
    font-size:10px;color:rgba(255,255,255,.22);line-height:1.5;
    font-family:var(--mono);letter-spacing:.01em;
  }

  /* 路由容器 */
  .router-box{
    position:absolute;border:1px dashed rgba(91,157,255,.22);
    border-radius:14px;background:rgba(91,157,255,.022);
  }
  .router-box .rb-label{
    position:absolute;left:16px;bottom:10px;font-size:10.5px;
    color:rgba(91,157,255,.55);font-family:var(--mono);
  }

  /* 节点 */
  .node{
    position:absolute;border-radius:11px;padding:11px 13px;
    background:linear-gradient(180deg,#1c2028,#15181e);
    border:1px solid rgba(255,255,255,.1);cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden;
    transition:border-color .18s,background .18s,box-shadow .18s,opacity .3s,filter .3s;
    z-index:2;
  }
  .node.compact{padding:9px 12px}
  .node::before{
    content:"";position:absolute;left:0;top:11px;bottom:11px;width:2.5px;
    border-radius:0 3px 3px 0;background:var(--tone);opacity:.85;
  }
  .node[data-band="build"]{--tone:var(--amber)}
  .node[data-band="data"]{--tone:var(--cyan)}
  .node[data-band="state"]{--tone:var(--violet)}
  .node[data-band="view"]{--tone:var(--blue)}
  .node[data-band="persist"]{--tone:var(--emerald)}
  .node[data-band="ext"]{--tone:var(--orange)}
  .node.floor{border-style:dashed;background:linear-gradient(180deg,#141a18,#101413)}
  .node:hover{border-color:rgba(255,255,255,.24);background:linear-gradient(180deg,#242a34,#1a1e26)}
  .node.active{
    border-color:var(--tone);
    box-shadow:0 0 0 1px rgba(255,255,255,.03),0 0 30px -8px var(--tone);
    background:linear-gradient(180deg,#252b35,#1a1e26);
  }
  .node.on{
    border-color:var(--tone);
    box-shadow:0 0 0 1px rgba(255,255,255,.02),0 0 24px -9px var(--tone);
    background:linear-gradient(180deg,#21262f,#161a20);
  }
  .node.dim{opacity:.14;filter:saturate(.35)}
  .node.soft{opacity:.4}
  .n-row{display:flex;align-items:center;gap:7px;min-width:0}
  .n-dot{
    width:6px;height:6px;border-radius:50%;background:var(--tone);
    flex:0 0 auto;opacity:.9;
  }
  .n-title{
    font-size:13px;font-weight:600;letter-spacing:.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .n-tag{
    margin-left:auto;flex:0 0 auto;font-size:9.5px;color:var(--fg-3);
    border:1px solid var(--line);border-radius:999px;padding:1px 6px;
    font-weight:400;letter-spacing:.01em;
  }
  .n-sub{
    font-size:11px;color:var(--fg-2);line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding-left:13px;
  }
  .n-meta{
    font-family:var(--mono);font-size:10px;color:#7b8494;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding-left:13px;line-height:1.4;
  }

  /* 连线 */
  .wire{
    fill:none;stroke-width:1.5;stroke-linecap:round;
    transition:opacity .3s,stroke-width .25s,stroke-opacity .25s;
    opacity:.62;
  }
  .wire.dashed{stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-22}}
  .wire.dim{opacity:.1}
  .wire.soft{opacity:.3}
  .wire.active{opacity:1;stroke-width:2.2}
  .tone-amber{stroke:var(--amber)}
  .tone-cyan{stroke:var(--cyan)}
  .tone-violet{stroke:var(--violet)}
  .tone-blue{stroke:var(--blue)}
  .tone-emerald{stroke:var(--emerald)}
  .tone-orange{stroke:var(--orange)}
  .elabel text{
    font-family:var(--mono);font-size:9.5px;fill:var(--fg-2);
    text-anchor:middle;dominant-baseline:middle;
  }
  .elabel rect{fill:#0d0f12;stroke:rgba(255,255,255,.08);rx:4}

  /* ---------- 详情抽屉 ---------- */
  .inspector{
    position:absolute;top:12px;right:12px;bottom:12px;width:372px;
    background:rgba(13,15,19,.94);backdrop-filter:blur(14px);
    border:1px solid var(--line-2);border-radius:14px;
    padding:18px 18px 16px;overflow-y:auto;
    transform:translateX(calc(100% + 20px));opacity:0;
    transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .25s;
    z-index:20;scrollbar-width:thin;
  }
  .inspector.open{transform:none;opacity:1}
  .inspector::-webkit-scrollbar{width:6px}
  .inspector::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .ins-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .ins-badge{
    font-size:9.5px;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
    border:1px solid currentColor;opacity:.9;
  }
  .ins-close{
    margin-left:auto;appearance:none;background:transparent;border:0;color:var(--fg-3);
    cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:6px;
  }
  .ins-close:hover{color:var(--fg);background:rgba(255,255,255,.06)}
  .ins-title{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:8px}
  .ins-file{
    font-family:var(--mono);font-size:10.5px;color:var(--fg-2);
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;word-break:break-all;line-height:1.5;
  }
  .ins-role{
    font-size:12.5px;color:var(--fg-2);line-height:1.65;margin:14px 0 4px;
  }
  .ins-h{
    font-size:10px;letter-spacing:.14em;color:var(--fg-3);
    font-family:var(--mono);margin:16px 0 8px;
  }
  .ins-list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .ins-list li{
    font-size:12px;line-height:1.65;color:#c3cad6;padding-left:12px;position:relative;
  }
  .ins-list li::before{
    content:"";position:absolute;left:0;top:8px;width:4px;height:4px;
    border-radius:50%;background:var(--tone,#666);opacity:.8;
  }
  .ins-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .ins-link{
    appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.02);
    color:var(--fg-2);font-family:inherit;font-size:11px;
    padding:4px 9px;border-radius:7px;cursor:pointer;transition:.15s;
  }
  .ins-link:hover{border-color:var(--line-2);color:var(--fg);background:rgba(255,255,255,.05)}

  /* ---------- 图例 ---------- */
  .panhint{display:none}
  @media (max-width:900px){
    .panhint{
      display:block;position:absolute;right:10px;bottom:10px;z-index:11;
      font-size:10.5px;color:var(--fg-3);background:rgba(10,11,14,.82);
      border:1px solid var(--line);padding:5px 9px;border-radius:8px;
      backdrop-filter:blur(8px);
    }
  }
  .legend{
    position:absolute;left:14px;bottom:12px;z-index:10;
    display:flex;gap:14px;align-items:center;
    background:rgba(10,11,14,.82);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:10.5px;color:var(--fg-3);
  }
  .lg{display:flex;align-items:center;gap:6px}
  .lg svg{display:block;overflow:visible}

  /* ---------- 底部 ---------- */
  .foot{
    flex:0 0 auto;display:flex;align-items:center;gap:16px;
    padding:12px 26px 16px;min-height:52px;
  }
  .foot-l{display:flex;align-items:center;gap:10px;min-width:0}
  .foot-dot{
    width:7px;height:7px;border-radius:50%;background:var(--cyan);flex:0 0 auto;
    box-shadow:0 0 10px rgba(51,194,214,.7);
  }
  .foot-dot.idle{background:var(--fg-3);box-shadow:none}
  .foot-name{font-size:12px;color:var(--fg);font-weight:500;white-space:nowrap}
  .foot-text{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot-text b{color:var(--fg-2);font-weight:400}
  .foot-r{margin-left:auto;display:flex;align-items:center;gap:5px}
  .fdot{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);transition:.25s}
  .fdot.on{background:var(--cyan);box-shadow:0 0 8px rgba(51,194,214,.6)}

  @media (max-width:900px){
    .top{padding:14px 16px 10px;flex-wrap:wrap;gap:10px}
    .top h1{font-size:16px}
    .top .sub{font-size:11px}
    .tools{margin-left:0;width:100%}
    .chips{padding:0 16px 10px}
    .viewport{margin:0 12px;border-radius:12px}
    .inspector{
      width:auto;left:8px;right:8px;top:auto;bottom:8px;height:64%;
      transform:translateY(calc(100% + 20px));
    }
    .inspector.open{transform:none}
    .legend{display:none}
    .foot{padding:10px 16px 14px;flex-wrap:wrap}
    .foot-r{display:none}
    .foot-text{white-space:normal;font-size:11px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="kicker">architecture · interview trainer</div>
      <h1>面试刷题工作台 · 整体架构与数据流向</h1>
      <p class="sub"><b>Vue 3 纯静态前端</b> · 构建期预渲染 · 无服务端 · 本地持久化 · 1421 题 / 15 门课</p>
    </div>
    <div class="tools">
      <div class="zoombox">
        <button id="zoomOut" title="缩小">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" title="放大">+</button>
      </div>
      <button class="tbtn" id="fit">适配画布</button>
    </div>
  </header>

  <nav class="chips" id="chips"></nav>

  <main class="viewport" id="viewport">
    <div class="stage" id="stage">
      <svg id="wires" width="1600" height="920" viewBox="0 0 1600 920"></svg>
      <div id="nodes"></div>
    </div>
    <aside class="inspector" id="inspector"></aside>
    <div class="panhint">拖拽平移 · 点 + 放大</div>
    <div class="legend">
      <div class="lg">
        <svg width="26" height="8"><path d="M0,4 L24,4" stroke="#e8a33d" stroke-width="1.6" fill="none"/><path d="M19,1 L24,4 L19,7" fill="#e8a33d"/></svg>
        构建
      </div>
      <div class="lg">
        <svg width="26" height="8"><path d="M0,4 L24,4" stroke="#33c2d6" stroke-width="1.6" fill="none"/><path d="M19,1 L24,4 L19,7" fill="#33c2d6"/></svg>
        供给
      </div>
      <div class="lg">
        <svg width="26" height="8"><path d="M0,4 L24,4" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/><path d="M19,1 L24,4 L19,7" fill="#34d399"/></svg>
        写回 / 缓存
      </div>
      <div class="lg">
        <svg width="26" height="8"><path d="M0,4 L24,4" stroke="#ff8f5e" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/></svg>
        外部网络
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="foot-l">
      <span class="foot-dot idle" id="footDot"></span>
      <span class="foot-name" id="footName"></span>
      <span class="foot-text" id="footText">点节点看实现细节 · 上方选一个场景可播放完整数据流</span>
    </div>
    <div class="foot-r" id="footDots"></div>
  </footer>
</div>

<script>
/* =========================================================
   1. 数据模型
   ========================================================= */
const TONE = { build:'amber', data:'cyan', state:'violet', view:'blue', persist:'emerald', ext:'orange' };

const BANDS = [
  { id:'build', x:24,  y:8, w:316, h:784, label:'① 构建时', note:'npm run parse · courses', tone:'amber' },
  { id:'data',  x:400, y:8, w:272, h:784, label:'② 静态产物', note:'直接部署 · 无接口', tone:'cyan' },
  { id:'state', x:732, y:8, w:356, h:784, label:'③ 运行时状态', note:'唯一数据出入口', tone:'violet' },
  { id:'view',  x:1148,y:8, w:428, h:784, label:'④ 视图层', note:'双壳 · 12 条路由', tone:'blue' },
];

const NODES = {
  /* ---- 构建时 ---- */
  A1:{x:44,y:56,w:276,h:104,band:'build',title:'源文档 · Markdown',tag:'事实源',
      sub:'java 889 · go 304 · ai 136 · arch 92',
      meta:'../java · ../golang · ../ai · ../arch',
      file:'../java  ../golang  ../ai  ../arch',
      role:'题库与面经的唯一事实源，全部以 Markdown 笔记维护。',
      points:[
        'java 11 册 889 题、go 6 册 304 题、ai 7 册 136 题、arch 5 册 92 题，合计 1421 题',
        '专题、章节、题号全部由文档标题层级推导，改文档即改题库',
        '只被构建脚本读取，运行时完全接触不到 Markdown',
      ]},
  A2:{x:44,y:192,w:276,h:124,band:'build',title:'parse.mjs · 题库解析',tag:'npm run parse',
      sub:'Markdown → JSON，构建期预渲染 HTML',
      meta:'marked + highlight.js · 题数自检',
      file:'scripts/parse.mjs',
      role:'把 Markdown 一次性编译成前端可直接使用的 JSON，运行时不解析 Markdown。',
      points:[
        '输出 index.json（专题元数据 / 高频榜 / 文档目录）、{topicId}.json（题目）、docs/{id}.json（整篇面经）',
        'marked + highlight.js 在构建期把代码块染好色，前端主包因此不需要这两个依赖',
        '带题数自检：与逐文件实测基准比对，偏差直接报错退出，避免静默漏题',
        '由 predev / prebuild 自动触发，正常开发不会忘记跑',
      ]},
  A3:{x:44,y:348,w:276,h:104,band:'build',title:'curriculum · 课程作者源',tag:'authoring',
      sub:'阶段 / 讲义 / 章节选择器',
      meta:'schema 约束 · audit 教学审计',
      file:'scripts/curriculum/{java,go,ai,arch}/*.mjs',
      role:'课程作者源：声明阶段、讲义与「章节选择器」，只引用题目 id。',
      points:[
        'schema.mjs 约束块类型与字段上限，audit.mjs 做教学审计（讲义字数、explore 分支必填项）',
        '与题库解耦：不复制题面，题库改题不必改课程',
        '每门课在 index.mjs 注册，构建时统一读取',
      ]},
  A4:{x:44,y:484,w:276,h:124,band:'build',title:'build-courses.mjs',tag:'npm run courses',
      sub:'校验 → 覆盖率 → 课程 JSON',
      meta:'--check / --partial / --audit',
      file:'scripts/build-courses.mjs',
      role:'把作者源编译成课程 JSON，并把不合格的课程挡在产物之外。',
      points:[
        '校验讲义长度、全局题目覆盖率、教学审计；--check 只校验不写盘',
        '产出 courses/index.json（摘要 + buildHash）与 courses/{id}.json（阶段 / 课时 / questionIds）',
        '同时写 .blockindex.json（块地址 → 指纹），供 course-tool 定点改块',
        '--skeleton / --partial 是分批写作的过渡态，避免半成品阻塞整条流水线',
      ]},
  A5:{x:44,y:640,w:276,h:84,band:'build',title:'course-tool.mjs',tag:'块级编辑',
      sub:'按指纹定位讲义块',

      {t:'题目要点 + 自评状态拼进 system prompt，三种模式分流',n:['D6','C4'],e:['e_c4d6']},
      {t:'按供应商类型走三套协议，fetch 直连，无代理',n:['C4','LLM'],e:['e_c4llm']},
      {t:'SSE 逐行解析，AbortController 可随时中断',n:['C4'],e:[]},
      {t:'200ms 节流落盘；超限按「单会话 → 会话数 → 总量」三级裁剪',n:['C4','LS'],e:['e_c4ls']},
    ],
  },
  {
    id:'offline', name:'离线可用', hint:'SW 全量预缓存',
    nodes:['SW','B1','B2','B4','B5','C1','C2','D2','D4'],
    edges:['e_sw','e_b1c1','e_b2c1','e_b4c2','e_b5c2'],
    steps:[
      {t:'首次访问：Service Worker 预缓存全部 JS / CSS / JSON（≈9.8MB）',n:['SW','B6'],e:['e_sw']},
      {t:'断网后导航走 navigateFallback → index.html',n:['SW'],e:[]},
      {t:'data/*.json 由 SW 直接命中缓存，store 完全无感知',n:['B1','B2','C1'],e:['e_b1c1','e_b2c1']},
      {t:'进度与对话本就在 localStorage，离线读写不受影响',n:['C1','C2','D2','D4'],e:[]},
    ],
  },
];

/* =========================================================
   2. 几何 / 路径
   ========================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';

function sidePoint(n, side, ratio){
  const r = ratio == null ? .5 : ratio;
  if(side === 'right')  return {x:n.x + n.w,        y:n.y + n.h*r};
  if(side === 'left')   return {x:n.x,              y:n.y + n.h*r};
  if(side === 'top')    return {x:n.x + n.w*r,      y:n.y};
  return                       {x:n.x + n.w*r,      y:n.y + n.h};
}
const OUT_DIR = { right:[1,0], left:[-1,0], top:[0,-1], bottom:[0,1] };
const IN_DIR  = { left:[1,0], right:[-1,0], top:[0,1], bottom:[0,-1] };

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function dedupe(pts){
  const out = [];
  for(const p of pts){
    const last = out[out.length-1];
    if(!last || Math.abs(last.x-p.x) > .4 || Math.abs(last.y-p.y) > .4) out.push({x:p.x,y:p.y});
  }
  return out;
}

/** 在需要斜线的位置插入正交拐点：优先延续来向 */
function orthogonalize(pts){
  const out = [pts[0]];
  for(let i=1;i<pts.length;i++){
    const a = out[out.length-1], prev = out[out.length-2], b = pts[i];
    if(Math.abs(a.x-b.x) > .5 && Math.abs(a.y-b.y) > .5){
      const cameHorizontal = prev ? Math.abs(prev.y-a.y) < .5 : true;
      out.push(cameHorizontal ? {x:b.x, y:a.y} : {x:a.x, y:b.y});
    }
    out.push(b);
  }
  return dedupe(out);
}

function roundedPath(pts, r){
  const p = dedupe(pts);
  if(p.length < 2) return '';
  if(p.length === 2) return `M${p[0].x},${p[0].y} L${p[1].x},${p[1].y}`;
  let d = `M${p[0].x},${p[0].y}`;
  for(let i=1;i<p.length-1;i++){
    const prev = p[i-1], cur = p[i], next = p[i+1];
    const l1 = dist(prev,cur), l2 = dist(cur,next);
    const rr = Math.min(r, l1/2, l2/2);
    const v1 = {x:(prev.x-cur.x)/l1, y:(prev.y-cur.y)/l1};
    const v2 = {x:(next.x-cur.x)/l2, y:(next.y-cur.y)/l2};
    const a = {x:cur.x + v1.x*rr, y:cur.y + v1.y*rr};
    const b = {x:cur.x + v2.x*rr, y:cur.y + v2.y*rr};
    d += ` L${a.x.toFixed(1)},${a.y.toFixed(1)} Q${cur.x},${cur.y} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
  }
  const end = p[p.length-1];
  d += ` L${end.x},${end.y}`;
  return d;
}

function edgeGeometry(edge){
  const a = NODES[edge.from], b = NODES[edge.to];
  const p0 = sidePoint(a, edge.fs, edge.fo);
  const p1 = sidePoint(b, edge.ts, edge.ti);
  const od = OUT_DIR[edge.fs], id = IN_DIR[edge.ts];
  const stub = edge.stub || 18;
  const s1 = {x:p0.x + od[0]*stub, y:p0.y + od[1]*stub};
  const s2 = {x:p1.x - id[0]*stub, y:p1.y - id[1]*stub};

  const raw = [p0, s1];
  if(edge.wp) raw.push(...edge.wp);
  else if(edge.mid != null && od[0] !== 0 && id[0] !== 0){
    const mid = edge.mid;
    raw.push({x:mid, y:s1.y}, {x:mid, y:s2.y});
  }
  raw.push(s2, p1);
  return roundedPath(orthogonalize(raw), 10);
}

/* =========================================================
   3. 渲染
   ========================================================= */
const stage = document.getElementById('stage');
const nodesEl = document.getElementById('nodes');
const svg = document.getElementById('wires');
const viewport = document.getElementById('viewport');

const TONES = ['amber','cyan','violet','blue','emerald','orange'];

function renderStatic(){
  // 分层带
  const bandHtml = BANDS.map(b => `
    <div class="band" data-band="${b.id}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;--tone:var(--${b.tone})">
      <div class="band-label"><i></i><b>${b.label}</b></div>
      <div class="band-note">${b.note}</div>
    </div>`).join('');

  const routerBox = `
    <div class="router-box" style="left:1152px;top:196px;width:416px;height:596px">
      <div class="rb-label">RouterView · 12 视图 · 懒加载 + 空闲预取</div>
    </div>`;

  nodesEl.insertAdjacentHTML('beforebegin', bandHtml + routerBox);

  // 节点
  nodesEl.innerHTML = Object.entries(NODES).map(([id,n]) => `
    <div class="node${n.compact?' compact':''}${n.floor?' floor':''}" data-id="${id}" data-band="${n.band}"
         style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px">
      <div class="n-row"><span class="n-dot"></span><span class="n-title">${n.title}</span><span class="n-tag">${n.tag}</span></div>
      <div class="n-sub">${n.sub}</div>
      <div class="n-meta">${n.meta}</div>
    </div>`).join('');

  // 箭头定义
  const defs = document.createElementNS(SVGNS,'defs');
  defs.innerHTML = TONES.map(t => `
    <marker id="ar-${t}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5"
            orient="auto-start-reverse"><path d="M0.6,0.6 L7.6,4 L0.6,7.4 Z" fill="var(--${t})"/></marker>`).join('');
  svg.appendChild(defs);

  // 连线
  const edgeLayer = document.createElementNS(SVGNS,'g');
  edgeLayer.setAttribute('class','edge-layer');
  svg.appendChild(edgeLayer);

  for(const e of EDGES){
    const p = document.createElementNS(SVGNS,'path');
    p.setAttribute('d', edgeGeometry(e));
    p.setAttribute('class', `wire tone-${e.tone}${e.dashed?' dashed':''}`);
    p.dataset.id = e.id;
    if(e.both){
      p.setAttribute('marker-end', `url(#ar-${e.tone})`);
      p.setAttribute('marker-start', `url(#ar-${e.tone})`);
    } else {
      p.setAttribute('marker-end', `url(#ar-${e.tone})`);
    }
    edgeLayer.appendChild(p);
  }

  // 边标签
  const labelLayer = document.createElementNS(SVGNS,'g');
  labelLayer.setAttribute('class','label-layer');
  svg.appendChild(labelLayer);
  for(const e of EDGES){
    if(!e.label) continue;
    const path = edgeLayer.querySelector(`[data-id="${e.id}"]`);
    const len = path.getTotalLength();
    const pt = path.getPointAtLength(len * (e.lp == null ? .5 : e.lp));
    const w = e.label.length * 6.4 + 12;
    const g = document.createElementNS(SVGNS,'g');
    g.setAttribute('class','elabel');
    g.dataset.for = e.id;
    g.innerHTML = `<rect x="${pt.x - w/2}" y="${pt.y - 7.5}" width="${w}" height="15" rx="4"></rect>
                   <text x="${pt.x}" y="${pt.y + .5}">${e.label}</text>`;
    labelLayer.appendChild(g);
  }
}

/* =========================================================
   4. 视图变换
   ========================================================= */
const view = { x:0, y:0, s:1 };

function apply(){
  stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  document.getElementById('zoomVal').textContent = Math.round(view.s * 100) + '%';
}

function fit(){
  const r = viewport.getBoundingClientRect();
  const s = Math.min((r.width - 20) / 1600, (r.height - 20) / 920, 1.2);
  // 窄屏全图会缩到 30% 完全不可读：改为按可读比例停在第一列，拖拽查看
  if(r.width < 900 && s < .5){
    view.s = .55;
    view.x = 12;
    view.y = Math.max(8, (r.height - 920 * .55) / 2);
    apply();
    return;
  }
  view.s = Math.max(s, .3);
  view.x = (r.width - 1600 * view.s) / 2;
  view.y = (r.height - 920 * view.s) / 2;
  apply();
}

function zoomAt(cx, cy, factor){
  const next = Math.min(2.2, Math.max(.32, view.s * factor));
  const k = next / view.s;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;
  view.s = next;
  apply();
}

viewport.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const r = viewport.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY > 0 ? .9 : 1.1);
}, { passive:false });

let drag = null;
let suppressClick = false;
viewport.addEventListener('pointerdown', (ev) => {
  if(ev.target.closest('.node') || ev.target.closest('.inspector') || ev.target.closest('.legend')) return;
  drag = { sx:ev.clientX, sy:ev.clientY, ox:view.x, oy:view.y, moved:false };
  viewport.classList.add('dragging');
  viewport.setPointerCapture(ev.pointerId);
});
viewport.addEventListener('pointermove', (ev) => {
  if(!drag) return;
  if(Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 6) drag.moved = true;
  view.x = drag.ox + (ev.clientX - drag.sx);
  view.y = drag.oy + (ev.clientY - drag.sy);
  apply();
});
viewport.addEventListener('pointerup', () => {
  // 拖完图会紧跟一次 click，别把面板关掉
  if(drag && drag.moved){
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
  }
  drag = null;
  viewport.classList.remove('dragging');
});
viewport.addEventListener('pointercancel', () => { drag = null; viewport.classList.remove('dragging'); });

document.getElementById('zoomIn').onclick = () => {
  const r = viewport.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, 1.15);
};
document.getElementById('zoomOut').onclick = () => {
  const r = viewport.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, 1/1.15);
};
document.getElementById('fit').onclick = fit;
window.addEventListener('resize', () => { if(!activeScene) fit(); });

/* =========================================================
   5. 详情抽屉
   ========================================================= */
const inspector = document.getElementById('inspector');
let selected = null;

function neighborsOf(id){
  const set = new Set();
  for(const e of EDGES){
    if(e.from === id) set.add(e.to);
    if(e.to === id) set.add(e.from);
  }
  return [...set];
}

function openNode(id){
  const n = NODES[id];
  if(!n) return;
  selected = id;

  document.querySelectorAll('.node').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  const band = BANDS.find(b => b.id === n.band);
  const toneName = n.band === 'persist' ? 'emerald' : n.band === 'ext' ? 'orange' : TONE[n.band];
  const bandLabel = band ? band.label : (n.band === 'persist' ? '持久 / 离线' : '外部服务');
  const nb = neighborsOf(id);

  inspector.style.setProperty('--tone', `var(--${toneName})`);
  inspector.innerHTML = `
    <div class="ins-top">
      <span class="ins-badge" style="color:var(--${toneName})">${bandLabel}</span>
      <span class="ins-badge" style="color:var(--fg-3)">${n.tag}</span>
      <button class="ins-close" id="insClose" aria-label="关闭">×</button>
    </div>
    <div class="ins-title">${n.title}</div>
    <div class="ins-file">${n.file}</div>
    <p class="ins-role">${n.role}</p>
    <div class="ins-h">实 现 要 点</div>
    <ul class="ins-list">${n.points.map(p => `<li>${p}</li>`).join('')}</ul>
    ${nb.length ? `<div class="ins-h">关 联 节 点</div>
      <div class="ins-links">${nb.map(x => `<button class="ins-link" data-goto="${x}">${NODES[x].title}</button>`).join('')}</div>` : ''}
  `;
  inspector.classList.add('open');
  inspector.querySelector('#insClose').onclick = closeInspector;
  inspector.querySelectorAll('[data-goto]').forEach(btn => {
    btn.onclick = () => openNode(btn.dataset.goto);
  });
}

function closeInspector(){
  inspector.classList.remove('open');
  selected = null;
  document.querySelectorAll('.node.active').forEach(el => el.classList.remove('active'));
}

document.addEventListener('click', (ev) => {
  if(suppressClick) return;
  const node = ev.target.closest('.node');
  if(node){ openNode(node.dataset.id); }
  else if(!ev.target.closest('.inspector')){ closeInspector(); }
});
document.addEventListener('keydown', (ev) => {
  if(ev.key === 'Escape'){ closeInspector(); stopScene(); }
});

/* =========================================================
   6. 场景播放
   ========================================================= */
const chipsEl = document.getElementById('chips');
const footName = document.getElementById('footName');
const footText = document.getElementById('footText');
const footDot = document.getElementById('footDot');
const footDots = document.getElementById('footDots');

chipsEl.innerHTML = SCENES.map((s,i) => `
  <button class="chip" data-scene="${s.id}"><span class="cdot"></span>${s.name}<em>${i+1}</em></button>
`).join('');

let activeScene = null;
let sceneTimers = [];
let currentStep = -1;

function clearTimers(){
  sceneTimers.forEach(t => clearTimeout(t));
  sceneTimers = [];
}

function paint(sceneNodes, sceneEdges, activeNodes, activeEdges){
  const sn = new Set(sceneNodes), se = new Set(sceneEdges);
  const an = new Set(activeNodes || []), ae = new Set(activeEdges || []);

  document.querySelectorAll('.node').forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('dim', !sn.has(id));
    el.classList.toggle('soft', sn.has(id) && !an.has(id));
    el.classList.toggle('on', an.has(id));
  });
  document.querySelectorAll('.wire').forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('dim', !se.has(id));
    el.classList.toggle('soft', se.has(id) && !ae.has(id));
    el.classList.toggle('active', ae.has(id));
  });
  document.querySelectorAll('.elabel').forEach(el => {
    const on = ae.has(el.dataset.for);
    el.style.opacity = on ? '1' : '.2';
  });
}

function resetPaint(){
  document.querySelectorAll('.node').forEach(el => el.classList.remove('dim','soft','on'));
  document.querySelectorAll('.wire').forEach(el => el.classList.remove('dim','soft','active'));
  document.querySelectorAll('.elabel').forEach(el => el.style.opacity = '');
}

function setFoot(scene, idx){
  if(!scene){
    footName.textContent = '';
    footText.textContent = '点节点看实现细节 · 上方选一个场景可播放完整数据流';
    footDot.classList.add('idle');
    footDots.innerHTML = '';
    return;
  }
  footDot.classList.remove('idle');
  footName.textContent = scene.name;
  const step = scene.steps[idx];
  footText.innerHTML = step
    ? `<b>${idx+1}/${scene.steps.length}</b> &nbsp;${step.t}`
    : `<b>${scene.steps.length}/${scene.steps.length}</b> &nbsp;${scene.hint} · 已播完，可再点一次取消`;
  footDots.innerHTML = scene.steps.map((_,i) =>
    `<span class="fdot${i <= idx ? ' on' : ''}"></span>`).join('');
}

function playScene(id){
  const scene = SCENES.find(s => s.id === id);
  if(!scene) return;

  // 再次点击同一个场景 → 取消
  if(activeScene && activeScene.id === id){ stopScene(); return; }

  clearTimers();
  closeInspector();
  activeScene = scene;
  currentStep = -1;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.scene === id));

  let i = 0;
  const total = scene.steps.length;

  const run = () => {
    if(i >= total){
      setFoot(scene, total - 1);
      paint(scene.nodes, scene.edges, scene.nodes, scene.edges);
      return;
    }
    const st = scene.steps[i];
    setFoot(scene, i);
    paint(scene.nodes, scene.edges, st.n, st.e);
    i++;
    sceneTimers.push(setTimeout(run, 1500));
  };
  run();
}

function stopScene(){
  clearTimers();
  activeScene = null;
  currentStep = -1;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  resetPaint();
  setFoot(null, 0);
}

chipsEl.addEventListener('click', (ev) => {
  const chip = ev.target.closest('.chip');
  if(chip) playScene(chip.dataset.scene);
});

/* =========================================================
   7. 启动
   ========================================================= */
renderStatic();
fit();
setFoot(null, 0);
</script>
