<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>面试刷题工作台 · Java / Golang / AI 八股题库</title>
    <meta name="description" content="基于本地 Java / Golang / AI 面试题库文档构建的刷题应用:浏览检索、背题卡片、模拟面试、进度统计" />
    <script>
      // 在首帧前落主题,避免深色用户刷新时先闪一帧白屏
      ;(function () {
        try {
          var mode = localStorage.getItem('interview-trainer/theme') || 'system'
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
